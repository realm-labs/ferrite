plugins {
    id "net.fabricmc.fabric-loom" version "1.17.17"
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    runs {
        client {
            runDir = providers.gradleProperty("ferriteGameDir").getOrElse("run")
        }
    }

    mods {
        "ferrite-client-mcp" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

tasks.register("launcherJar", Jar) {
    dependsOn classes
    archiveClassifier = "launcher"
    from(sourceSets.main.output) {
        include "dev/ferrite/client/mcp/launcher/**"
    }
    manifest {
        attributes "Main-Class": "dev.ferrite.client.mcp.launcher.ClientLauncher"
    }
}

assemble.dependsOn launcherJar

def acceptanceJarTask = tasks.register("acceptanceJar", Jar) {
    dependsOn classes, launcherJar
    archiveClassifier = "acceptance"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.main.output) {
        include "dev/ferrite/client/mcp/launcher/**"
        include "dev/ferrite/client/mcp/acceptance/**"
    }
    from({
        configurations.runtimeClasspath
                .findAll { it.name.startsWith("gson-") }
                .collect { zipTree(it) }
    }) {
        include "com/google/gson/**"
    }
    from("THIRD_PARTY_NOTICES.md") {
        into "META-INF"
    }
    from("licenses/Apache-2.0.txt") {
        into "META-INF"
        rename { "LICENSE-GSON.txt" }
    }
    manifest {
        attributes "Main-Class": "dev.ferrite.client.mcp.acceptance.AcceptanceRunner"
    }
}

assemble.dependsOn acceptanceJar

def verifyDistributionTask = tasks.register("verifyDistribution") {
    dependsOn acceptanceJarTask
    doLast {
        def archive = acceptanceJarTask.get().archiveFile.get().asFile
        def forbidden = zipTree(archive).matching {
            include "net/minecraft/**"
            include "net/fabricmc/**"
        }.files
        if (!forbidden.isEmpty()) {
            throw new GradleException("acceptance JAR must not redistribute Minecraft or Fabric classes")
        }
        def requiredNotices = zipTree(archive).matching {
            include "META-INF/THIRD_PARTY_NOTICES.md"
            include "META-INF/LICENSE-GSON.txt"
        }.files
        if (requiredNotices.size() != 2) {
            throw new GradleException("acceptance JAR must carry the Gson notice and Apache-2.0 license")
        }
    }
}

check.dependsOn verifyDistributionTask

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "com.google.code.gson:gson:${project.gson_version}"

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

dependencyLocking {
    lockAllConfigurations()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
    options.compilerArgs.addAll(["-Xlint:all", "-Werror"])
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

test {
    useJUnitPlatform()
}
