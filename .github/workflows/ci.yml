name: ci

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  portable-determinism:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Verify cross-platform deterministic vectors
        run: cargo test -p ferrite-replay --test cross_platform_vectors -- --nocapture

  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Install Protocol Buffers compiler
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
          protoc --version
      - name: Verify repository policies
        run: |
          cargo ferrite architecture verify
          cargo ferrite source verify
          cargo ferrite deployment verify
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Check fuzz and property targets
        env:
          CARGO_TARGET_DIR: target/fuzz-check
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
          cargo clippy --manifest-path fuzz/Cargo.toml --bins -- -D warnings
      - name: Run workspace tests
        run: cargo test --workspace --all-features
      - name: Prove topology equivalence
        run: cargo ferrite topology verify
      - name: Exercise behavior scenario harness
        run: |
          cargo run -q -p behavior-runner -- validate tests/fixtures/scenarios/recording-smoke.toml
          cargo run -q -p behavior-runner -- run tests/fixtures/scenarios/recording-smoke.toml

  client-mcp-java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/ferrite-client-mcp
    steps:
      - uses: actions/checkout@v6
      - name: Install Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
          cache-dependency-path: |
            tools/ferrite-client-mcp/gradle.lockfile
            tools/ferrite-client-mcp/gradle/verification-metadata.xml
            tools/ferrite-client-mcp/gradle/wrapper/gradle-wrapper.properties
      - name: Build and verify the client MCP distributions
        run: ./gradlew --no-daemon clean check build
