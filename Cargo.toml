[workspace]
resolver = "3"
members = [
    "apps/behavior-runner",
    "apps/ferrite-cluster",
    "apps/ferrite-server",
    "apps/protocol-conformance",
    "apps/world-inspector",
    "crates/ferrite-foundation",
    "crates/ferrite-gameplay",
    "crates/ferrite-persistence",
    "crates/ferrite-protocol",
    "crates/ferrite-region-runtime",
    "crates/ferrite-registry",
    "crates/ferrite-replay",
    "crates/ferrite-server-runtime",
    "crates/ferrite-simulation",
    "crates/ferrite-testkit",
    "crates/ferrite-tooling",
    "crates/ferrite-world",
    "tools/mc-reference",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
bevy_ecs = { version = "0.19", default-features = false, features = ["std", "multi_threaded"] }
blake3 = "1"
ferrite-foundation = { path = "crates/ferrite-foundation" }
ferrite-gameplay = { path = "crates/ferrite-gameplay" }
ferrite-persistence = { path = "crates/ferrite-persistence" }
ferrite-protocol = { path = "crates/ferrite-protocol" }
ferrite-region-runtime = { path = "crates/ferrite-region-runtime" }
ferrite-registry = { path = "crates/ferrite-registry" }
ferrite-replay = { path = "crates/ferrite-replay" }
ferrite-server-runtime = { path = "crates/ferrite-server-runtime" }
ferrite-simulation = { path = "crates/ferrite-simulation" }
ferrite-testkit = { path = "crates/ferrite-testkit" }
ferrite-world = { path = "crates/ferrite-world" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"
toml = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true
